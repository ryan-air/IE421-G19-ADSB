name: core

on:
  push:
    paths:
      - "core/**"
      - "gateway/**"
      - "ads/**"
      - "protocol/**"
      - "spec/**"
      - "bench/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "gateway/**"
      - "ads/**"
      - "protocol/**"
      - "spec/**"
      - "bench/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail (the default shell has no
    # pipefail, so `ctest ... | tee` would hide a failing test).
    shell: bash
    working-directory: core

jobs:
  test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, asan, tsan, release]
        include:
          # Naive baseline (mutex queues, std::unordered_map) must pass the
          # same tests: it is a data-structure swap, not different logic.
          - compiler: gcc
            preset: naive-baseline
    env:
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-14' || 'clang++-18' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-18

      # Kernels >= 6.5 use 32 bits of mmap ASLR entropy, which older
      # sanitizer runtimes cannot handle ("unexpected memory mapping").
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.preset == 'asan' || matrix.preset == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -G Ninja -DADSB_WERROR=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz:
    name: libFuzzer smoke (60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build fuzzers
        run: |
          cmake --preset fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++-18 -DADSB_WERROR=ON
          cmake --build --preset fuzz

      - name: Fuzz
        run: |
          for target in beast decoder packet feed demod carrier; do
            mkdir -p "/tmp/corpus_$target"
            cp fuzz/corpus/$target/* "/tmp/corpus_$target/"
            ./build/fuzz/fuzz/fuzz_$target -max_total_time=60 -print_final_stats=1 \
              "/tmp/corpus_$target"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: core/crash-*

  bench-build:
    name: benchmarks build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        env:
          CXX: g++-14
        run: |
          cmake --preset bench -G Ninja -DADSB_WERROR=ON
          cmake --build --preset bench
      # CI runners are shared VMs, so numbers are not meaningful; this only
      # checks that the benchmarks run.
      - name: Smoke run
        run: ./build/bench/bench/adsb_bench --benchmark_min_time=0.01s

  host-check:
    name: check-host.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n scripts/check-host.sh
          bash -n scripts/tune-host.sh
          bash -n scripts/check-determinism.sh
          bash -n scripts/check-feed.sh
          bash -n ../bench/legacy/run.sh
          bash -n ../bench/legacy/run_bench.sh
          python3 -m py_compile ../bench/legacy/feeder.py ../bench/legacy/probe.py ../bench/legacy/analyze.py
      - name: tune-host.sh dry run (changes nothing)
        run: |
          ./scripts/tune-host.sh --dry-run --cpus 1
          ./scripts/tune-host.sh --status
      - name: Run (must not write to stderr)
        run: |
          ./scripts/check-host.sh 2> /tmp/err.txt
          cat /tmp/err.txt
          test ! -s /tmp/err.txt
          ./scripts/check-host.sh --json 2> /tmp/err.txt | python3 -m json.tool > /dev/null
          test ! -s /tmp/err.txt

  determinism:
    name: replay determinism (GCC vs Clang vs naive)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-18
      - name: Build GCC optimized, GCC naive, Clang optimized
        run: |
          CXX=g++-14 cmake --preset release -G Ninja -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build --preset release
          CXX=g++-14 cmake --preset naive-baseline -G Ninja -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF -DADSB_BUILD_BENCH=OFF
          cmake --build --preset naive-baseline
          CXX=clang++-18 cmake -S . -B build/clang-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/clang-release
      # Same recording => identical output across replay modes, the naive
      # build, and compilers (possible because -ffp-contract=off).
      - name: Check
        run: ./scripts/check-determinism.sh build/release build/naive-baseline build/clang-release
      # A recorded Beast capture imported as .adsbrec (time from its own
      # 12 MHz counter), then replayed.
      - name: Beast import
        run: ./scripts/check-beast-import.sh build/release
      - name: Decoder dump (adsb-decode)
        run: ./scripts/check-decode.sh build/release

  protocol:
    name: feed protocol (generator + C++/JS/Python golden tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generated code is up to date
        run: python3 protocol/gen.py --check
      - name: Python
        run: python3 -m unittest discover -s protocol/tests -v
      - name: JavaScript
        run: node protocol/tests/test_feed.mjs

  tlc:
    name: TLA+ model check (feed recovery)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: spec/.tools
          key: tla2tools-v1.7.4
      - run: bash spec/run-tlc.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-logs
          path: spec/out/

  live-ingest:
    name: live ingest against readsb (integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      # Builds the bench image (readsb + toolchain), then streams synthetic
      # traffic through readsb into adsb-live, including a readsb restart.
      - name: Run
        run: bench/live/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ingest
          path: bench/live/out/

  feed:
    name: feed recovery (publisher -> multicast -> subscribers, integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/feed -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/feed
      # Loss, a small retransmit ring (snapshot fallback), a late joiner and a
      # publisher restart; every subscriber's book must match the publisher's
      # byte for byte, and the publisher's must match a plain replay.
      - name: Run
        run: FEED_IFACE=127.0.0.1 scripts/check-feed.sh build/feed

  gateway:
    name: websocket gateway (unit tests, then publisher -> gateway -> clients)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Unit tests (subscriber port, simulation, WebSocket, fan-out, flow control)
        working-directory: gateway
        run: node --test --test-timeout 60000 test/*.test.mjs
      - name: Build publisher tools
        run: |
          CXX=g++-14 cmake -S . -B build/gw -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/gw
      # Loss, a small ring (snapshot fallback), a late-joining gateway, a slow
      # WebSocket client and a publisher restart: every gateway's book and
      # every client's table must equal the publisher's book byte for byte.
      - name: Integration
        run: FEED_IFACE=127.0.0.1 ../gateway/scripts/check-gateway.sh build/gw

  overload:
    name: overload semantics (adsb-live past saturation, README_UPDATES.md §10)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/ovl -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/ovl
      # 0.5x, 2x and 10x saturation and a 10x burst: loss only at the input
      # boundary and counted, bounded queueing delay, no upstream pushback,
      # constant memory, and the feed's subscriber still matches the publisher.
      - name: Run
        run: scripts/check-overload.sh build/ovl

  ab:
    name: A/B line arbitration (replay, two Beast lines, two IQ receivers; README_UPDATES.md §6)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/ab -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/ab
      # Union of the lines, no cross-line duplicate reaches the engine, the
      # relative radio clock, outages lose no aircraft, a live run's
      # arbitration repeats exactly on replay, and with two IQ receivers the
      # arbiter matches exactly the frames both demodulators decoded.
      - name: Run
        run: scripts/check-ab.sh build/ab
      # The same checks with every tool under GCC's ThreadSanitizer: adsb-live
      # runs one ingest thread per line plus the merging state thread, the
      # recorder and the publisher. Unit tests do not start those threads, and
      # GCC's TSan has caught races Clang's missed. Any report fails the step,
      # even when the tool's exit status is not checked by the script.
      - name: Build (ThreadSanitizer)
        run: |
          CXX=g++-14 cmake -S . -B build/ab-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DADSB_SANITIZE=thread -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/ab-tsan
      - name: Run (ThreadSanitizer)
        run: |
          mkdir -p "$RUNNER_TEMP/tsan"
          # The instrumented demodulator is slower than real time: pace the IQ lines at 1/4.
          AB_IQ_SPEED=0.25 TSAN_OPTIONS="halt_on_error=0 log_path=$RUNNER_TEMP/tsan/report" scripts/check-ab.sh build/ab-tsan
          if compgen -G "$RUNNER_TEMP/tsan/report*" > /dev/null; then
            cat "$RUNNER_TEMP"/tsan/report*
            echo "ThreadSanitizer reported a race" >&2
            exit 1
          fi

  conflate:
    name: conflated feed (both tools -> conflated + main feeds -> subscribers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/conf -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/conf
      # Subscribers that keep up, lose bursts, or join late, from adsb-publish
      # and adsb-live: every conflated book must equal the main feed's state.
      - name: Run
        run: FEED_IFACE=127.0.0.1 scripts/check-conflate.sh build/conf

  shm:
    name: shared-memory transport (publisher -> ring -> subscribers, integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/shm -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/shm
      # A subscriber that keeps up, one that is lapped and resyncs by snapshot,
      # a late joiner, and a publisher restart: every book must equal the
      # publisher's byte for byte.
      - name: Run
        run: scripts/check-shm.sh build/shm

  memory-model:
    name: GenMC model check (SPSC ring, shm slot protocol, mutants)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: genmc
        with:
          path: spec/.tools/genmc-v0.20.0
          key: genmc-v0.20.0-llvm19-ubuntu24.04-${{ runner.arch }}
      # The cached build still needs LLVM 19's runtime (GenMC compiles the
      # models with clang-19 at run time).
      - name: Install LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 llvm-19-dev libffi-dev
      - name: Build GenMC
        run: echo "GENMC=$(bash spec/memory-model/build-genmc.sh)" >> "$GITHUB_ENV"
      # Every correct model verifies; every mutant (an ordering weakened, a
      # protocol step removed) is caught.
      - run: bash spec/memory-model/run.sh

  ring-stress:
    name: ring stress (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/stress -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/stress --target adsb-ring-stress
      # Real hardware, both memory models (x86 TSO, ARM weak): every message
      # exactly once, in order, intact; laps reported. Longer runs: see
      # spec/memory-model/README.md.
      - run: build/stress/tools/adsb-ring-stress --seconds 60 --seed ${{ github.run_number }}

  uring:
    name: io_uring feed transport (unit tests, feed and overload suites over io_uring)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 liburing-dev pkg-config
      # ADSB_IO_URING=ON: a missing liburing fails the build instead of
      # silently compiling the stub (and skipping every io_uring test).
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/uring -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_IO_URING=ON
          cmake --build build/uring
      - name: Unit tests (must run, not skip)
        run: |
          ctest --test-dir build/uring -R "Uring|^FeedTx\\." --output-on-failure | tee uring-tests.txt
          ! grep -q "Skipped" uring-tests.txt
      - name: Feed suite over io_uring (loss, snapshots, late join, restart)
        run: |
          FEED_IFACE=127.0.0.1 FEED_TRANSPORT=uring scripts/check-feed.sh build/uring
          FEED_IFACE=127.0.0.1 FEED_TRANSPORT=uring-nosqpoll scripts/check-feed.sh build/uring
      - name: Overload suite with adsb-live on io_uring
        run: FEED_TRANSPORT=uring scripts/check-overload.sh build/uring
      # For the log only: GitHub's shared runners are not a latency host.
      - name: TX bench (kernel vs io_uring)
        run: build/uring/tools/adsb-tx-bench --seconds 2 --rounds 2

  xdp:
    name: AF_XDP feed transport (publisher and subscriber; unit tests, feed and overload suites over a veth pair)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 iproute2 libcap2-bin
      # ADSB_AF_XDP=ON: missing kernel headers fail the build instead of
      # silently compiling the stub (and skipping every AF_XDP test).
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/xdp -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_AF_XDP=ON
          cmake --build build/xdp
      # Both ends in this namespace: frames sent on veth0 arrive on veth1.
      # accept_local: the source address is local; the ARP entry lets unicast
      # find veth1's MAC. File capabilities instead of sudo, so the build
      # tree stays the runner's: CAP_NET_RAW for XSK sockets, plus
      # CAP_NET_ADMIN and CAP_BPF where the subscriber side loads and
      # attaches its XDP program.
      - name: veth pair and capabilities
        run: |
          sudo ip link add veth0 type veth peer name veth1
          sudo ip addr add 10.11.0.1/24 dev veth0
          sudo ip addr add 10.11.0.2/24 dev veth1
          sudo ip link set veth0 up
          sudo ip link set veth1 up
          sudo sysctl -w net.ipv4.conf.all.accept_local=1 net.ipv4.conf.all.rp_filter=0 net.ipv4.conf.veth1.rp_filter=0
          sudo ip neigh replace 10.11.0.2 lladdr "$(cat /sys/class/net/veth1/address)" dev veth0 nud permanent
          sudo setcap cap_net_raw,cap_net_admin,cap_bpf+ep build/xdp/tests/adsb_xdp_tests
          sudo setcap cap_net_raw,cap_net_admin,cap_bpf+ep build/xdp/tools/adsb-feed-cli
          for t in adsb-publish adsb-live; do sudo setcap cap_net_raw+ep build/xdp/tools/$t; done
      - name: Unit tests (must run, not skip)
        run: |
          echo "RLIMIT_MEMLOCK: $(ulimit -l) KiB"
          ADSB_XDP_TEST=10.11.0.1,10.11.0.2 ctest --test-dir build/xdp -R "Xdp" --output-on-failure | tee xdp-tests.txt
          ! grep -q "Skipped" xdp-tests.txt
      - name: Feed suite over AF_XDP (loss, snapshots, late join, restart)
        run: FEED_TRANSPORT=xdp FEED_IFACE=10.11.0.1 FEED_SUB_IFACE=10.11.0.2 scripts/check-feed.sh build/xdp
      # The subscribers receive through AF_XDP too: every feed datagram must
      # come out of the XSK, none through the kernel socket.
      - name: Feed suite over AF_XDP both ways (subscriber side redirects with XDP)
        run: FEED_TRANSPORT=xdp FEED_RX=xdp FEED_IFACE=10.11.0.1 FEED_SUB_IFACE=10.11.0.2 scripts/check-feed.sh build/xdp
      - name: Overload suite with adsb-live on AF_XDP
        run: FEED_TRANSPORT=xdp OVL_FEED_HOST=10.11.0.2 OVL_PUB_IFACE=10.11.0.1 scripts/check-overload.sh build/xdp
      # For the log only: GitHub's shared runners are not a latency host. The
      # receiver gets its own namespace so kernel UDP crosses the veth too.
      - name: Bench over veth (kernel vs AF_XDP copy mode, sending and receiving)
        run: |
          sudo ip link add vb0 type veth peer name vb1
          sudo ip netns add rx
          sudo ip link set vb1 netns rx
          sudo ip addr add 10.12.0.1/24 dev vb0
          sudo ip -n rx addr add 10.12.0.2/24 dev vb1
          sudo ip link set vb0 up
          sudo ip -n rx link set vb1 up
          sudo build/xdp/tools/adsb-tx-bench --transport kernel,xdp --rx all --interface 10.12.0.1 --dest 10.12.0.2 \
            --rx-netns rx --xdp-mode copy --seconds 2 --rounds 2

  dst:
    name: deterministic simulation (seed sweep, GCC and Clang must agree)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-18
      - name: Build (GCC and Clang)
        run: |
          CXX=g++-14 cmake -S . -B build/dst-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/dst-gcc --target adsb-dst
          CXX=clang++-18 cmake -S . -B build/dst-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF
          cmake --build build/dst-clang --target adsb-dst
      # New seeds on every run (the start depends on the run number), the
      # same seeds for both compilers. A failure prints the seed, its world
      # and the replay command. Equal sweep hashes: a seed is the same run
      # whichever compiler built it.
      - name: Sweep
        run: |
          START=$(( ${{ github.run_number }} * 1000000 ))
          build/dst-gcc/tools/adsb-dst --seeds 40000 --start $START | tee gcc.txt
          build/dst-clang/tools/adsb-dst --seeds 40000 --start $START | tee clang.txt
          test "$(grep '^sweep hash' gcc.txt)" = "$(grep '^sweep hash' clang.txt)"

  iq:
    name: synthetic IQ, demodulator (against the truth and readsb), IQ into adsb-live
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libncurses-dev zlib1g-dev libzstd-dev librtlsdr-dev pkg-config
      # The same pinned readsb as the bench image (bench/legacy/Dockerfile),
      # without SDR libraries: it only reads IQ files.
      - name: Build readsb
        run: |
          git clone --depth 1 --branch v3.16.21 https://github.com/wiedehopf/readsb.git /tmp/readsb
          make -C /tmp/readsb -j"$(nproc)" RTLSDR=no
      # ADSB_RTLSDR=ON: adsb-live is built with the real librtlsdr source
      # (a missing librtlsdr fails the build); without a dongle on the runner
      # only its "no device" path runs, the rest through the test device.
      - name: Build
        run: |
          CXX=g++-14 cmake -S . -B build/iq -G Ninja -DCMAKE_BUILD_TYPE=Release -DADSB_WERROR=ON -DADSB_BUILD_TESTS=OFF -DADSB_RTLSDR=ON
          cmake --build build/iq --target adsb-iqsynth adsb-demod adsb-live adsb-feed-cli adsb-carrier
      # Determinism and formats, then readsb decodes cu8 and cs16 files
      # (clean 15-30 dB messages >= 97%, timestamps within one sample),
      # impairments, multipath echoes, and the gain trade-off.
      - name: Generator
        run: scripts/check-iq.sh build/iq /tmp/readsb/readsb
