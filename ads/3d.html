<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Aircraft Tracker</title>

    <!-- Cesium.js -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #7a9a7a;
            overflow: hidden;
        }

        #cesiumContainer {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Top header */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.9);
            padding: 15px 20px;
            border-bottom: 2px solid #7a9a7a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .top-header h1 {
            font-size: 24px;
            color: #7a9a7a;
            letter-spacing: 2px;
        }

        .header-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-inline {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .stat-label {
            color: #5a7a5a;
            font-size: 14px;
        }

        .stat-value {
            color: #7a9a7a;
            font-weight: bold;
            font-size: 16px;
        }

        .status {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #7a9a7a;
            box-shadow: 0 0 10px #7a9a7a;
        }

        .status-dot.disconnected {
            background: #c85a54;
            box-shadow: 0 0 10px #c85a54;
        }

        /* Controls panel */
        .controls-overlay {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #7a9a7a;
            border-radius: 8px;
            padding: 15px;
            z-index: 1000;
            min-width: 200px;
        }

        .controls-overlay h3 {
            color: #7a9a7a;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .control-button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: rgba(122, 154, 122, 0.2);
            border: 1px solid #7a9a7a;
            color: #7a9a7a;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .control-button:hover {
            background: rgba(122, 154, 122, 0.4);
            border-color: #8aaa8a;
        }

        .control-button.active {
            background: rgba(122, 154, 122, 0.6);
            border-color: #9aba9a;
        }

        /* Info panel */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #7a9a7a;
            border-radius: 8px;
            padding: 15px;
            z-index: 1000;
            max-width: 350px;
            max-height: 300px;
            overflow-y: auto;
        }

        .info-panel h3 {
            color: #7a9a7a;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .info-panel .aircraft-info {
            color: #7a9a7a;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-panel .aircraft-info strong {
            color: #8aaa8a;
        }

        /* View mode buttons */
        .view-modes {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .view-mode-btn {
            flex: 1;
            padding: 8px;
            background: rgba(122, 154, 122, 0.2);
            border: 1px solid #7a9a7a;
            color: #7a9a7a;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .view-mode-btn:hover {
            background: rgba(122, 154, 122, 0.4);
        }

        .view-mode-btn.active {
            background: rgba(122, 154, 122, 0.6);
            border-color: #9aba9a;
        }

        /* Navigation link */
        .nav-link {
            position: absolute;
            top: 80px;
            left: 20px;
            z-index: 1000;
        }

        .nav-link a {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(122, 154, 122, 0.2);
            border: 2px solid #7a9a7a;
            border-radius: 8px;
            color: #7a9a7a;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }

        .nav-link a:hover {
            background: rgba(122, 154, 122, 0.4);
            border-color: #8aaa8a;
        }
    </style>
</head>
<body>
    <!-- Top header bar -->
    <header class="top-header">
        <h1>✈ 3D AIR TRAFFIC CONTROL</h1>
        <div class="header-controls">
            <div class="status">
                <span id="status-indicator" class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
            <div class="stat-inline">
                <span class="stat-label">Aircraft:</span>
                <span class="stat-value" id="aircraft-count">0</span>
            </div>
            <div class="stat-inline">
                <span class="stat-label">Collisions:</span>
                <span class="stat-value" id="collision-count">0</span>
            </div>
        </div>
    </header>

    <!-- Navigation link -->
    <div class="nav-link">
        <a href="index.html">← Back to 2D View</a>
    </div>

    <!-- Cesium 3D container -->
    <div id="cesiumContainer"></div>

    <!-- Controls -->
    <div class="controls-overlay">
        <h3>View Controls</h3>
        <div class="view-modes">
            <button id="view-globe" class="view-mode-btn active">Globe</button>
            <button id="view-follow" class="view-mode-btn">Follow</button>
        </div>
        <button id="toggle-airports" class="control-button">Toggle Airports</button>
        <button id="toggle-trails" class="control-button">Toggle Trails</button>
        <button id="toggle-terrain" class="control-button">Toggle Terrain</button>
        <button id="reset-view" class="control-button">Reset View</button>

        <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #7a9a7a;">
            <h3 style="font-size: 12px; margin-bottom: 8px;">Trackpad Controls:</h3>
            <div style="font-size: 10px; line-height: 1.6; color: #8aaa8a;">
                • Drag: Rotate view<br>
                • 2-finger scroll: Zoom<br>
                • Shift + drag: Tilt<br>
                • Cmd + drag: Look around<br>
            </div>
        </div>
    </div>

    <!-- Info panel -->
    <div class="info-panel" id="info-panel" style="display: none;">
        <h3>Aircraft Information</h3>
        <div id="info-content" class="aircraft-info"></div>
    </div>

    <!-- Follow mode hint -->
    <div id="follow-hint" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.95); border: 2px solid #7a9a7a; border-radius: 8px; padding: 20px; text-align: center; z-index: 2000; pointer-events: none;">
        <div style="color: #7a9a7a; font-family: 'Courier New', monospace; font-size: 16px;">
            <strong>Follow Mode Active</strong><br>
            <span style="font-size: 12px; color: #8aaa8a;">Click on any aircraft to follow it</span>
        </div>
    </div>

    <script src="cesium-app.js"></script>
</body>
</html>
