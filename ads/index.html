<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Aircraft Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top header bar -->
    <header class="top-header">
        <h1>✈ AIR TRAFFIC CONTROL</h1>
        <div class="header-controls">
            <div class="status">
                <span id="status-indicator" class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
            <div class="stat-inline">
                <span class="stat-label">Aircraft:</span>
                <span class="stat-value" id="aircraft-count">0</span>
            </div>
            <div class="stat-inline">
                <span class="stat-label">Update:</span>
                <span class="stat-value" id="last-update">--</span>
            </div>
            <div class="stat-inline">
                <span class="stat-label">Collisions:</span>
                <span class="stat-value" id="collision-count" style="color: #ff8800;">0</span>
            </div>
        </div>
    </header>

    <!-- Map container (fullscreen) -->
    <div id="map"></div>

    <!-- Controls overlay (top-right) - Simplified -->
    <div class="controls-overlay">
        <div class="control-panel">
            <h3>Controls</h3>
            <button id="toggle-list" class="control-button">Toggle Aircraft List</button>
            <button id="toggle-statistics" class="control-button">Toggle Statistics</button>
            <button id="toggle-airports" class="control-button">Toggle Airports</button>
            <button id="toggle-predictions" class="control-button" onclick="togglePredictionWedges()">⚪ Show Predictions</button>
            <button onclick="window.location.href='3d.html'" class="control-button" style="background: rgba(122, 154, 122, 0.3); border-color: #8aaa8a;">View in 3D 🌍</button>
        </div>
    </div>

    <!-- Aircraft list panel (bottom, collapsible) -->
    <div id="aircraft-list-panel" class="aircraft-list-panel">
        <div class="aircraft-list-header">
            <h2>Aircraft List</h2>
            <button id="close-list" class="close-button">×</button>
        </div>
        <div id="aircraft-list" class="aircraft-list"></div>
    </div>

    <!-- Statistics panel (right side, collapsible) -->
    <div id="statistics-panel" class="statistics-panel">
        <div class="statistics-header">
            <h2>Statistics Dashboard</h2>
            <button id="close-statistics" class="close-button">×</button>
        </div>
        <div id="statistics-content" class="statistics-content">
            <div class="loading-state">Loading statistics...</div>
        </div>
    </div>

    <!-- Mobile menu toggle -->
    <button class="mobile-menu-toggle" id="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script>
        // Mobile menu toggle
        function toggleMobileMenu() {
            const sidebar = document.querySelector('.controls-overlay');
            const toggle = document.getElementById('mobile-menu-toggle');
            sidebar.classList.toggle('mobile-open');
            toggle.classList.toggle('active');
            toggle.textContent = sidebar.classList.contains('mobile-open') ? '✕' : '☰';
        }

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            const sidebar = document.querySelector('.controls-overlay');
            const toggle = document.getElementById('mobile-menu-toggle');
            if (window.innerWidth <= 768 && 
                sidebar.classList.contains('mobile-open') && 
                !sidebar.contains(e.target) && 
                !toggle.contains(e.target)) {
                sidebar.classList.remove('mobile-open');
                toggle.classList.remove('active');
                toggle.textContent = '☰';
            }
        });
    </script>
</body>
</html>
